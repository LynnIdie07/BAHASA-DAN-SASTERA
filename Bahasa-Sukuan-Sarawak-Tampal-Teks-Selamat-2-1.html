/* Jadual editorial: neutral, boleh dilaraskan; jadual data awam kekal berasingan */
.editor table,.published-rich table,.story-article table{border-collapse:collapse!important;border-spacing:0!important;table-layout:auto;width:max-content;max-width:100%;min-width:0;display:table;background:transparent!important}
.editor table td,.editor table th,.published-rich table td,.published-rich table th,.story-article table td,.story-article table th{position:static!important;left:auto!important;top:auto!important;z-index:auto!important;min-width:35px!important;max-width:none;min-height:24px;padding:5px 8px;border:1px solid #a6b3ae!important;background:transparent!important;color:inherit!important;font-weight:normal!important;text-align:left;vertical-align:top;white-space:normal;overflow-wrap:break-word}
.editor table td:first-child,.editor table th:first-child,.published-rich table td:first-child,.published-rich table th:first-child,.story-article table td:first-child,.story-article table th:first-child{position:static!important;background:transparent!important;font-weight:normal!important;min-width:35px!important}
.editor table td,.editor table th{resize:horizontal;overflow:auto}
.published-rich,.story-article{overflow-x:auto}

/* Editorial tables only: ordinary unshaded, non-bold leftmost column.
   This is deliberately scoped to rich text, not Entri or admin management tables. */
.editor :is(table,tbody,thead,tfoot,tr,td,th),
.published-rich :is(table,tbody,thead,tfoot,tr,td,th),
.story-article :is(table,tbody,thead,tfoot,tr,td,th){background-color:transparent!important;background-image:none!important;}
.editor table :is(td,th):first-child,
.published-rich table :is(td,th):first-child,
.story-article table :is(td,th):first-child{font-weight:400!important;color:inherit!important;box-shadow:none!important;position:static!important;left:auto!important;}
.editor table :is(td,th):first-child :is(b,strong),
.published-rich table :is(td,th):first-child :is(b,strong),
.story-article table :is(td,th):first-child :is(b,strong){font-weight:400!important;}
.editor table th,.published-rich table th,.story-article table th{font-weight:400!important;}

/* Neutral editorial grids — never style the first column as a frozen key. */
:is(.editor,.published-rich,.story-article) table :is(col,colgroup,thead,tbody,tfoot,tr,td,th){background:#fff!important;background-color:#fff!important;background-image:none!important;box-shadow:none!important;}
:is(.editor,.published-rich,.story-article) table :is(td,th){position:static!important;left:auto!important;top:auto!important;color:#18323a!important;font-weight:400!important;min-width:35px!important;}
:is(.editor,.published-rich,.story-article) table tr > :is(td,th):first-child,
:is(.editor,.published-rich,.story-article) table tr > :is(td,th):first-child *{background:transparent!important;background-color:transparent!important;background-image:none!important;color:#18323a!important;font-weight:400!important;text-shadow:none!important;box-shadow:none!important;}
:is(.editor,.published-rich,.story-article) table tr > :is(td,th):first-child{background:#fff!important;}

/* Editor: no automatic bold/shading; explicit author formatting must work in ANY cell. */
:is(.editor,.published-rich,.story-article) table :is(td,th),
:is(.editor,.published-rich,.story-article) table :is(td,th):first-child {font-weight:400!important;background:#fff!important;color:inherit!important;}
:is(.editor,.published-rich,.story-article) table :is(td,th) :is(strong,b),
:is(.editor,.published-rich,.story-article) table :is(td,th):first-child :is(strong,b),
:is(.editor,.published-rich,.story-article) table :is(td,th) [style*="font-weight"] {font-weight:700!important;}
:is(.editor,.published-rich,.story-article) table :is(td,th) th {font-weight:400;}
.editor table {user-select:text;}

.editor { min-height:220px; height:360px; max-height:85vh; resize:both!important; overflow:auto!important; min-width:280px; max-width:100%; background:white; }

function quizStart(){ensureExtra();let d=isCatVisible('Daftar Kata')?state.datasets['Daftar Kata'].filter((r,i)=>isEntryVisible('Daftar Kata',i)):[],pool=[];for(let i=1;i<langs().length;i++){let values=d.filter(r=>r[0]&&r[i]);if(values.length>=4)for(let r of values)pool.push({i,r,values})}pool.sort(()=>Math.random()-.5);quiz=pool.slice(0,10).map(x=>{let correct=x.r[x.i],opts=[correct,...[...new Set(x.values.map(r=>r[x.i]).filter(v=>v&&v!==correct))].sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);return {lang:langs()[x.i],word:x.r[0],correct,opts}});let manual=state.manualQuiz.filter(q=>q.visible!==false).map(q=>{let i=langs().indexOf(q.lang),values=d.map(r=>r[i]).filter(v=>v&&v!==q.correct),opts=[q.correct,...[...new Set(values)].sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);return {...q,opts}}).filter(q=>q.opts.length===4);quiz=[...manual,...quiz].sort(()=>Math.random()-.5).filter((q,i,a)=>a.findIndex(y=>y.word===q.word&&y.lang===q.lang)===i).slice(0,10);answers={};quizSubmitted=false;render()}function answerQuiz(i,choice){if(quizSubmitted)return;answers[i]=choice;render()}

function neutralEditorialTableHTML(html){
 if(!html)return '';
 // Only neutralize the cell background and default header formatting. Never
 // remove user-applied <b>, <strong>, <span style="font-weight:..."> or text colors.
 if(!/<table\b/i.test(html))return html;
 const root=document.createElement('div');root.innerHTML=html;
 root.querySelectorAll('table').forEach(table=>{
  table.querySelectorAll('*').forEach(el=>{
   el.style.removeProperty('background');el.style.removeProperty('background-color');
   el.style.removeProperty('background-image');el.removeAttribute('bgcolor');
  });
  table.querySelectorAll('td,th').forEach(cell=>{
   if(/^(bold|[6-9]00)$/i.test(cell.style.fontWeight.trim())){
    const strong=document.createElement('strong');while(cell.firstChild)strong.appendChild(cell.firstChild);cell.appendChild(strong);
   }
   cell.style.removeProperty('font-weight');
  });
 });
 return root.innerHTML;
}

function copyEditorTable(){
 const ed=$('rich'),r=editorRange(),n=r?.startContainer,cell=(n?.nodeType===1?n:n?.parentElement)?.closest?.('td,th');
 const table=cell?.closest('table');if(!table||!ed?.contains(table)){alert('Klik dalam jadual yang hendak disalin.');return;}
 // Selection-based copy uses the browser's clipboard permissions and works offline.
 const selection=window.getSelection(),backup=[];
 for(let i=0;i<selection.rangeCount;i++)backup.push(selection.getRangeAt(i).cloneRange());
 const selectionRange=document.createRange();selectionRange.selectNode(table);

// Tampalan selamat: utamakan text/plain daripada clipboard untuk mengelakkan HTML Word/Excel yang terlalu berat.
const PASTE_MAX_TEXT=250000, PASTE_MAX_CELLS=5000, PASTE_MAX_LINES=2000;
function pastePlainFragment(plain){
 const result=document.createDocumentFragment();
 let text=String(plain||'').slice(0,PASTE_MAX_TEXT).replace(/\u0000/g,'').replace(/\r\n?/g,'\n');
 if(text.length>PASTE_MAX_TEXT)text=text.slice(0,PASTE_MAX_TEXT);
 const isTable=text.includes('\t');
 if(isTable){
   const lines=text.replace(/\n$/,'').split('\n').slice(0,PASTE_MAX_LINES);
   const table=document.createElement('table');table.className='editor-table';table.style.tableLayout='auto';table.style.width='max-content';
   let cells=0;
   for(const line of lines){
     if(cells>=PASTE_MAX_CELLS)break;
     const row=table.insertRow();
     const values=line.split('\t');
     for(const value of values){
       if(cells>=PASTE_MAX_CELLS)break;
       const td=row.insertCell();cells++;
       td.textContent=value;
       td.style.background='#fff';
       td.style.minWidth='10px';
       td.style.height='auto';
     }
   }
   if(table.rows.length)result.appendChild(table);
 }else{
   const lines=text.split('\n').slice(0,PASTE_MAX_LINES);
   for(let i=0;i<lines.length;i++){
     if(i)result.appendChild(document.createElement('br'));
     result.appendChild(document.createTextNode(lines[i]));
   }
 }
 return result;
}
function insertPasteFragment(ed,fragment){
 if(!ed||!fragment||!fragment.hasChildNodes())return false;
 const sel=window.getSelection();let range=null;
 if(sel&&sel.rangeCount){
   const r=sel.getRangeAt(0);
   if(ed.contains(r.commonAncestorContainer))range=r.cloneRange();
 }
 if(!range&&savedEditorRange&&ed.contains(savedEditorRange.commonAncestorContainer))range=savedEditorRange.cloneRange();
 if(!range){range=document.createRange();range.selectNodeContents(ed);range.collapse(false)}
 const marker=document.createTextNode('');
 fragment.appendChild(marker);
 range.deleteContents();
 range.insertNode(fragment);
 const end=document.createRange();end.setStartAfter(marker);end.collapse(true);
 marker.remove();
 if(sel){sel.removeAllRanges();sel.addRange(end)}
 savedEditorRange=end.cloneRange();
 ed.focus();
 return true;
}
function editorPaste(event){
 const ed=event.currentTarget,cd=event.clipboardData;
 if(!ed||!ed.isContentEditable||!cd)return;
 let plain='';
 try{plain=cd.getData('text/plain')||''}catch(e){plain=''}
 event.preventDefault();
 if(!plain){
   const msg=document.querySelector('.editor-status');
   if(msg)msg.textContent='Tiada teks biasa dalam salinan. Salin teks daripada Word atau Excel, kemudian cuba lagi. Untuk gambar, gunakan butang Gambar.';
   return;
 }
 try{
   const wasLimited=plain.length>PASTE_MAX_TEXT||plain.slice(0,PASTE_MAX_TEXT).split(/\r\n?|\n/).length>PASTE_MAX_LINES||plain.slice(0,PASTE_MAX_TEXT).split('\t').length+plain.slice(0,PASTE_MAX_TEXT).split(/\r\n?|\n/).length-2>PASTE_MAX_CELLS;
   const fragment=pastePlainFragment(plain);
   if(!insertPasteFragment(ed,fragment))throw Error('Tiada kandungan untuk ditampal');
   const msg=document.querySelector('.editor-status');
   if(msg)msg.textContent=wasLimited?'Tampalan besar dihadkan untuk kestabilan. Tampal secara berperingkat jika perlu.':'Tampalan berjaya.';
 }catch(err){
   console.error('Ralat tampal editorial',err);
   // Fallback ringan: masukkan teks biasa tanpa pemprosesan HTML.
   try{
     const fallback=document.createDocumentFragment();
     fallback.appendChild(document.createTextNode(String(plain).slice(0,PASTE_MAX_TEXT)));
     insertPasteFragment(ed,fallback);
   }catch(e){console.error('Fallback tampal gagal',e)}
 }
}

function updateEditorialButtons(){const ed=$('rich'),tools=document.querySelector('.editorial-tools');if(!tools)return;const selection=window.getSelection(),inside=!!(ed&&selection&&selection.rangeCount&&ed.contains(selection.anchorNode));const active=inside||document.activeElement===ed;ed?.classList.toggle('editor-mode',active);tools.classList.toggle('editor-toolbar-active',active);const status=tools.querySelector('.editor-status');if(status)status.textContent=active?'Mod suntingan aktif':'Klik pada kotak teks untuk mula menyunting';for(const b of tools.querySelectorAll('button[data-format]')){let enabled=false;if(inside){try{enabled=!!document.queryCommandState(b.dataset.format)}catch(e){}}b.classList.toggle('format-active',enabled);b.setAttribute('aria-pressed',String(enabled))}}

function resizeEditorTableCell(mode){const cell=editorSelectedCell();if(!cell)return alert('Klik di dalam sel jadual terlebih dahulu.');const table=cell.closest('table');const rows=[...table.rows];let value;
if(mode==='column'){

function editorKeyboard(event){if(!(event.ctrlKey||event.metaKey)||event.altKey)return;let key=event.key.toLowerCase();if(key==='z'||key==='y'){/* Preserve browser-native undo and redo inside contenteditable. */return;}if(key==='b'||key==='i'||key==='u'){event.preventDefault();formatEditor({b:'bold',i:'italic',u:'underline'}[key]);} }

function readMedia(f){return new Promise((resolve,reject)=>{if(!f)return resolve(null);if(f.size>3*1024*1024){alert('Fail media melebihi 3 MB. Untuk fail HTML luar talian, kecilkan saiz media terlebih dahulu.');return resolve(null)}let r=new FileReader();r.onload=()=>resolve({type:f.type,data:r.result});r.onerror=reject;r.readAsDataURL(f)})}let editorMedia=null;

function saveStory(i){let arr=state.items['Cerita Rakyat'],title=$('storyTitle')?.value.trim(),group=$('storyGroupInput')?.value;if(!title||!group)return alert('Isi Etnik/Bahasa dan Tajuk Cerita.');let html=neutralEditorialTableHTML($('rich').innerHTML),old=i<0?{}:arr[i];let temp=document.createElement('div');temp.innerHTML=html;temp.querySelectorAll('.media-selected').forEach(el=>el.classList.remove('media-selected'));let x={...old,kind:'story',title,group,html:temp.innerHTML,visible:old.visible!==false};if(i<0)arr.push(x);else arr[i]=x;if(save())render()}
function adminLinks(){return `<h3>Pautan Bahagian, Daerah dan Bahasa</h3><div class="row"><select id="divSel">${divisions.map(d=>`<option>${d}</option>`).join('')}</select><input id="district" placeholder="Nama daerah"><select id="linkLang">${langs().map(l=>`<option>${esc(l)}</option>`).join('')}</select><button onclick="addLink()">Tambah Pautan</button></div>${divisions.map(d=>`<div class="card"><b>${d}</b> ${(state.links[d]||[]).map((x,i)=>`<p>${esc(x.district)} — ${esc(x.language)} <button onclick="state.links[${arg(d)}].splice(${i},1);save();render()">Padam</button></p>`).join('')}</div>`).join('')}`}function addLink(){let d=$('divSel').value,dist=$('district').value.trim(),language=$('linkLang').value;if(!dist)return alert('Isi daerah');(state.links[d]||(state.links[d]=[])).push({district:dist,language});save();render()}
function download(name,text,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function adminTransfer(){return `<h3>Pemindahan dan Sandaran</h3><p>Gunakan HTML Lengkap untuk membawa data dan aplikasi ke komputer lain. Simpan semula selepas mengedit data.</p><div class="row"><button onclick="exportHTML()">Simpan HTML Lengkap (Untuk Komputer Lain)</button><button onclick="download('sandaran-bahasa-sukuan.json',JSON.stringify(state),'application/json')">Sandarkan Data JSON</button><label class="btn">Pulihkan Sandaran JSON <input type="file" hidden accept=".json" onchange="restoreJSON(this.files[0])"></label></div><p class="muted">Peringatan: data disimpan pada pelayar komputer ini. Fail media yang besar mungkin melebihi had storan pelayar.</p>`}function exportHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#bss-preview-overlay')?.remove();let el=clone.querySelector('#embedded-data');el.textContent=JSON.stringify(state).replace(/</g,'\u003c');clone.dataset.portableId=String(Date.now());download('Bahasa-Sukuan-Sarawak-Lengkap.html','<!doctype html>'+clone.outerHTML,'text/html;charset=utf-8')}async function restoreJSON(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!x.langs||!x.datasets||!x.menus)throw Error('Format tidak sah');if(!confirm('Gantikan data sedia ada dengan sandaran?'))return;state=x;selectedPublicContent={};save();render()}catch(e){alert('Gagal memulihkan: '+e.message)}}function exportCSV(){let arr=[langs(),...state.datasets[adminCat]],csv='\ufeff'+arr.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(adminCat.replace(/ /g,'-')+'.csv',csv,'text/csv;charset=utf-8')}
async function unzipXlsx(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),decoder=new TextDecoder('utf-8');let end=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-65560);i--)if(dv.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('Fail XLSX bukan arkib ZIP yang sah');let cursor=dv.getUint32(end+16,true),total=dv.getUint16(end+10,true),result={};for(let i=0;i<total;i++){if(dv.getUint32(cursor,true)!==0x02014b50)break;let method=dv.getUint16(cursor+10,true),size=dv.getUint32(cursor+20,true),nameLen=dv.getUint16(cursor+28,true),extraLen=dv.getUint16(cursor+30,true),commentLen=dv.getUint16(cursor+32,true),off=dv.getUint32(cursor+42,true),name=decoder.decode(buf.slice(cursor+46,cursor+46+nameLen));if(name==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/.test(name)){let dataStart=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),bytes=buf.slice(dataStart,dataStart+size);if(method===8){if(!('DecompressionStream' in window))throw Error('Pelayar tidak menyokong penyahmampatan XLSX');let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}else if(method!==0)throw Error('Jenis pemampatan XLSX tidak disokong');result[name]=decoder.decode(bytes)}cursor+=46+nameLen+extraLen+commentLen}return result}
function readXlsxCells(parts){let shared=[],parser=new DOMParser();if(parts['xl/sharedStrings.xml']){let xml=parser.parseFromString(parts['xl/sharedStrings.xml'],'application/xml');shared=Array.from(xml.getElementsByTagName('si')).map(n=>Array.from(n.getElementsByTagName('t')).map(e=>e.textContent).join(''))}let sheet=parts['xl/worksheets/sheet1.xml']||parts[Object.keys(parts).find(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x))];if(!sheet)throw Error('Tiada lembaran Excel');let xml=parser.parseFromString(sheet,'application/xml'),out=[];for(let row of Array.from(xml.getElementsByTagName('row'))){let values=[];for(let c of Array.from(row.getElementsByTagName('c'))){let ref=c.getAttribute('r')||'',letters=ref.match(/^[A-Z]+/)?.[0]||'A',ci=0;for(let ch of letters)ci=ci*26+ch.charCodeAt(0)-64;ci--;let v=c.getElementsByTagName('v')[0]?.textContent||'',type=c.getAttribute('t');if(type==='s')v=shared[Number(v)]||'';if(type==='inlineStr')v=Array.from(c.getElementsByTagName('t')).map(n=>n.textContent).join('');values[ci]=v}out.push(values.map(x=>String(x??'').trim()))}return out}
function parseCSV(t){let lines=[],row=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);lines.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);lines.push(row)}return lines}
async function importFile(f){if(!f)return;try{let ext=f.name.split('.').pop().toLowerCase(),lines=ext==='xlsx'?readXlsxCells(await unzipXlsx(f)):ext==='csv'?parseCSV(await f.text()):null;if(!lines)throw Error('Gunakan .xlsx atau CSV UTF-8. Untuk .xls lama, simpan semula daripada Excel sebagai .xlsx.');let headers=(lines.shift()||[]).map(s=>String(s||'').replace(/^\ufeff/,'').trim().toLowerCase()),indices=langs().map(l=>headers.indexOf(l.toLowerCase()));if(indices[0]<0)throw Error('Fail mesti mempunyai tajuk lajur Bahasa Melayu');let incoming=lines.map(r=>indices.map(i=>i<0?'':String(r[i]||'').trim())).filter(r=>r[0]);if(!incoming.length)throw Error('Tiada entri Bahasa Melayu yang boleh diimport');if(!confirm(`Tambah ${incoming.length} entri ke ${adminCat}? (Data asal dikekalkan)`))return;state.datasets[adminCat].push(...incoming);save();render()}catch(e){alert('Import gagal: '+e.message)}}
function ensureExtra(){state.menus ||= [];let utama=state.menus.find(m=>m.name==='Utama');if(utama)utama.visible=true;else state.menus.unshift({name:'Utama',visible:true});state.rowHidden ||= {};state.catHidden ||= {};state.manualQuiz ||= [];state.items ||= {};for(let c of Object.keys(state.datasets))state.rowHidden[c] ||= [];for(let n of ['Utama','Umum','Cerita Rakyat','Rakaman'])state.items[n] ||= [];if(!state.storyMigrated){let a=state.items['Cerita Rakyat'];let first=a.find(x=>x.kind==='submenu')?.title||'Belum Dikelaskan';let legacy=a.filter(x=>x.kind!=='submenu'&&x.kind!=='story');if(legacy.length&&!a.some(x=>x.kind==='submenu'))a.unshift({kind:'submenu',title:first,visible:true,html:''});for(let x of legacy){x.kind='story';x.group=first;}state.storyMigrated=true;}}
function isCatVisible(c){return !state.catHidden?.[c]}
function isEntryVisible(c,i){return !(state.rowHidden?.[c]||[]).includes(i)}
function toggleCategory(){ensureExtra();state.catHidden[adminCat]=!state.catHidden[adminCat];save();render()}
function toggleEntry(i){ensureExtra();let a=state.rowHidden[adminCat];state.rowHidden[adminCat]=a.includes(i)?a.filter(j=>j!==i):[...a,i];save();render()}
function adminLanguage(){return `<h3>Senarai Bahasa — Kategori Berpaut dengan Entri</h3><p>Kategori yang disembunyikan tidak terpapar kepada pengguna awam. Jumlah entri dikira terus daripada data Entri.</p>${Object.keys(state.datasets).map(c=>`<div class="card row"><b>${esc(c)}</b><span class="pill">${(state.datasets[c]||[]).length} rekod</span><button onclick="adminCat=${arg(c)};adminTab='Entri';render()">Edit</button><button class="secondary" onclick="adminCat=${arg(c)};toggleCategory()">${state.catHidden?.[c]?'Papar':'Sembunyi'}</button></div>`).join('')}${languageList()}`}
function adminQuiz(){return `<h3>Uji Kata — Soalan Tambahan</h3><p>10 soalan rawak dijana daripada padanan Entri. Soalan manual juga boleh ditambah. Hanya soalan yang disimpan serta dipaparkan tersedia kepada pengguna.</p><button onclick="quizEdit(-1)">Tambah Soalan</button><div id="quizAdminItems"></div>`}
function showQuizItems(){ensureExtra();let e=$('quizAdminItems');if(!e)return;e.innerHTML=state.manualQuiz.map((q,i)=>`<div class="card"><b>${esc(q.word)} — ${esc(q.lang)}</b> ${q.visible===false?'(Disembunyikan)':''}<p>Jawapan: ${esc(q.correct)}</p><button onclick="quizEdit(${i})">Edit</button> <button class="secondary" onclick="state.manualQuiz[${i}].visible=state.manualQuiz[${i}].visible===false;save();render()">${q.visible===false?'Papar':'Sembunyi'}</button> <button class="gold" onclick="if(confirm('Padam soalan?')){state.manualQuiz.splice(${i},1);save();render()}">Padam</button></div>`).join('')||'<p>Tiada soalan manual.</p>'}
function quizEdit(i){ensureExtra();let q=i<0?{word:'',lang:langs()[1],correct:'',options:[]}:state.manualQuiz[i];$('quizAdminItems').innerHTML=`<div class="card"><h3>${i<0?'Tambah':'Edit'} Soalan</h3><label>Perkataan Bahasa Melayu <input id="qw" value="${esc(q.word)}"></label> <label>Bahasa <select id="ql">${langs().slice(1).map(l=>`<option ${q.lang===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label><p>Jawapan mestilah wujud dalam padanan data Entri bagi kata dan bahasa yang dipilih.</p><button onclick="quizSave(${i})">SIMPAN</button><button class="secondary" onclick="render()">Batal</button></div>`}
function quizSave(i){let word=$('qw').value.trim(),lang=$('ql').value,idx=langs().indexOf(lang);let row=Object.values(state.datasets).flat().find(r=>r[0]?.toLowerCase()===word.toLowerCase()&&r[idx]);if(!row)return alert('Tiada padanan sebenar dalam data Entri bagi perkataan dan bahasa tersebut.');let x={word:row[0],lang,correct:row[idx],visible:i<0?true:state.manualQuiz[i].visible};if(i<0)state.manualQuiz.push(x);else state.manualQuiz[i]=x;save();render()}

function openPreview(){
 if(!admin)return;
 const old=document.getElementById('bss-preview-overlay');if(old)old.remove();
 const clone=document.documentElement.cloneNode(true);
 clone.querySelector('#embedded-data').textContent=JSON.stringify(state).replace(/</g,'\u003c');
 clone.querySelector('#bss-preview-overlay')?.remove();
 // The preview is an isolated public session (no admin credentials or shared storage).
 const frameHtml='<!doctype html>'+clone.outerHTML;
 const overlay=document.createElement('div');overlay.id='bss-preview-overlay';
 overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Previu paparan pengguna');
 overlay.innerHTML='<div class="preview-toolbar"><b>PREVIU PAPARAN PENGGUNA</b><span>Data yang telah disimpan • Paparan awam (baca sahaja)</span><button type="button" id="closePreview">Tutup Previu / Kembali ke Admin</button></div><iframe title="Previu laman pengguna" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>';
 document.body.appendChild(overlay);
 overlay.querySelector('#closePreview').onclick=()=>overlay.remove();
 overlay.querySelector('iframe').srcdoc=frameHtml;
}
function render(){nav();let m=state.menus.find(x=>x.name===page);if(!admin&&m&&m.visible===false)page='Utama';if(!admin&&!state.menus.some(x=>x.name===page)&&page!=='Dashboard Admin')page='Utama';$('app').innerHTML=page==='Dashboard Admin'&&admin?adminView():page==='Utama'?home():page==='Senarai Bahasa'?languageList():page==='Entri'?entry():page==='Uji Kata'?quizView():contentPage(page);if(page==='Entri')refreshResults();if(page==='Dashboard Admin'&&admin){if(adminTab==='Entri')adminRenderRows();if((['Utama','Umum','Rakaman'].includes(adminTab)||state.menus.some(m=>m.name===adminTab&&!['Entri','Senarai Bahasa','Uji Kata','Menu','Peta','Pemindahan'].includes(adminTab)))&&adminTab!=='Cerita Rakyat')showContentItems();if(adminTab==='Uji Kata')showQuizItems()}}ensureExtra();page='Utama';render();
</script></body></html>
